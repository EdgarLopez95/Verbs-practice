<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563EB">
    <meta name="description" content="Practica verbos irregulares en inglés con Verb Flow">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Verb Flow">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <base href="./">
    <title>Verb Flow</title>
    <link rel="manifest" href="assets/manifest.webmanifest">
    <link rel="icon" href="assets/icons/logo.png" type="image/png" sizes="512x512">
    <link rel="apple-touch-icon" href="assets/icons/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div id="app">
        <header class="hero" id="appHeader">
            <div class="header-inner">
                <div class="hero-brand" aria-label="Verb Flow">
                    <img src="assets/icons/logo.png" alt="" class="hero-brand__logo" width="40" height="40" decoding="async" role="presentation">
                    <span class="hero-brand__text">Verb Flow</span>
                </div>
            </div>
            <div id="heroPracticeBlock" class="hero-practice-block hidden">
                <div class="hero-practice">
                    <div class="hero-title-row">
                        <h1 class="hero-title">Practice</h1>
                        <button type="button" id="changeLevelBtn" class="hero-change-level">Change level</button>
                    </div>
                    <div class="hero-meta-row">
                        <span class="hero-set">Set: <span id="setCount">0</span>/5</span>
                    </div>
                    <div class="hero-progress-outer">
                        <div id="progressBar" class="hero-progress-wrap" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Progress">
                            <div id="progressFill" class="hero-progress-fill"></div>
                        </div>
                        <span id="progressText" class="hero-progress-text">0%</span>
                    </div>
                </div>
            </div>
        </header>
        <main class="app-main">
            <section id="levelSelect" class="view">
                <div class="level-screen">
                    <div class="level-hero">
                        <span class="level-hero__icon" aria-hidden="true">🎯</span>
                        <div class="level-hero__content">
                            <p class="level-hero__headline">Master irregular verbs</p>
                            <button type="button" id="verbsListBtn" class="level-hero__btn">
                                <span aria-hidden="true">📋</span>
                                <span>150 most used verbs</span>
                            </button>
                        </div>
                    </div>
                    <div class="level-intro">
                        <h1 class="level-intro-title">Select your level</h1>
                    </div>
                    <div class="level-cards">
                        <button type="button" class="level-card level-card--mandatory" data-level="mandatory">
                            <span class="level-card__bg-icon" aria-hidden="true">✓</span>
                            <div class="level-card__header">
                                <div class="level-card__titleGroup">
                                    <span class="level-card__icon" aria-hidden="true">✅</span>
                                    <h3 class="level-card__title">Obligatoria</h3>
                                </div>
                                <span class="level-badge">Recommended</span>
                            </div>
                            <div class="level-card__body">
                                <p class="level-card__count">50 verbos</p>
                                <p class="level-card__metric">Used verbs in daily conversation</p>
                                <p class="level-card__cta">Tap to begin</p>
                            </div>
                        </button>
                        <button type="button" class="level-card level-card--medium" data-level="medium">
                            <span class="level-card__bg-icon" aria-hidden="true">⚡</span>
                            <div class="level-card__header">
                                <div class="level-card__titleGroup">
                                    <span class="level-card__icon" aria-hidden="true">⚡</span>
                                    <h3 class="level-card__title">Medio</h3>
                                </div>
                                <span class="level-badge">Balanced</span>
                            </div>
                            <div class="level-card__body">
                                <p class="level-card__count">50 verbos</p>
                                <p class="level-card__metric">Common verbs used in storytelling</p>
                                <p class="level-card__cta">Tap to begin</p>
                            </div>
                        </button>
                        <button type="button" class="level-card level-card--hard" data-level="hard">
                            <span class="level-card__bg-icon" aria-hidden="true">🔥</span>
                            <div class="level-card__header">
                                <div class="level-card__titleGroup">
                                    <span class="level-card__icon" aria-hidden="true">🔥</span>
                                    <h3 class="level-card__title">Difícil</h3>
                                </div>
                                <span class="level-badge">Challenge</span>
                            </div>
                            <div class="level-card__body">
                                <p class="level-card__count">50 verbos</p>
                                <p class="level-card__metric">Advanced and irregular edge cases</p>
                                <p class="level-card__cta">Tap to begin</p>
                            </div>
                        </button>
                    </div>
                </div>
            </section>
            <section id="practice" class="view hidden" tabindex="-1">
                <h1>Practice</h1>
            </section>
            <section id="verbsList" class="view hidden" tabindex="-1">
                <div class="verbs-list-screen">
                    <div class="verbs-list-head">
                        <h2 class="verbs-list-title">All 150 verbs</h2>
                        <button type="button" id="verbsListBackBtn" class="verbs-list-back">Back</button>
                    </div>
                    <div class="verbs-list-tableWrap" id="verbsListTableWrap">
                        <table class="verbs-table">
                            <thead>
                                <tr>
                                    <th>Base</th>
                                    <th>Past</th>
                                    <th>Past participle</th>
                                </tr>
                            </thead>
                            <tbody id="verbsTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="src/app/bootstrap.js"></script>
</body>
</html>
